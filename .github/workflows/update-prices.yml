name: Mise à jour des prix Cardmarket

on:
  schedule:
    - cron: '17 3,9,15 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Récupérer les prix
        run: node scripts/update-prices.mjs
        env:
          CM_PRICE_GUIDE_URL: ${{ vars.CM_PRICE_GUIDE_URL }}
          CM_PRODUCTS_URLS: ${{ vars.CM_PRODUCTS_URLS }}
      - name: Enregistrer
        run: |
          git config user.name "pokevault-robot"
          git config user.email "pokevault-robot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Rien de nouveau."; else git commit -m "Prix Cardmarket du $(date -u +%F)" && git push; fi
